<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Bloco de Notas</h1>
        <p>As suas anotações são salvas automaticamente no navegador.</p>

        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..." aria-label="Bloco de notas"></textarea>

        <div class="actions">
            <button id="botaoLimpar" type="button">Limpar anotações</button>
            <span id="status" aria-live="polite"></span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
