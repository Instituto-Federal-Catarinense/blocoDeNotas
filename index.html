<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Meu bloco de notas</h1>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>

        <div class="toolbar">
            <button id="limparNota" type="button">Limpar nota</button>
            <span id="status" aria-live="polite"></span>
        </div>

        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..." aria-label="Bloco de notas"></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
