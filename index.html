<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Bloco de Notas</h1>
        <p>Suas anotações ficam salvas automaticamente no navegador.</p>

        <form class="note-form" onsubmit="return false;">
            <label for="noteTitle">Título da nota (opcional)</label>
            <input type="text" id="noteTitle" placeholder="Meu lembrete" aria-label="Título da nota">

            <label for="blocoDeNotas">Escreva suas notas</label>
            <textarea id="blocoDeNotas" rows="10" placeholder="Digite algo..." aria-label="Área de anotações"></textarea>

            <div class="actions">
                <button type="button" id="exportBtn">Exportar</button>
                <button type="button" id="importBtn">Importar</button>
                <button type="button" id="limparBtn">Limpar</button>
                <button type="button" id="temaBtn">Tema escuro</button>
            </div>
            <input type="file" id="fileInput" accept=".txt" hidden aria-hidden="true">
        </form>

        <div class="status" aria-live="polite" id="statusMessage"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
