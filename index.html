<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Bloco de notas do FABRÍCIO</h1>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>
        
        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..." aria-label="Bloco de notas"></textarea>

        <div class="actions">
            <button id="limparNota" type="button">Limpar nota</button>
            <span id="status" class="status" aria-live="polite">Carregando...</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
