<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bloco de Notas do Vítor</h1>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>

        <label for="blocoDeNotas" class="label">Sua anotação</label>
        <textarea id="blocoDeNotas" placeholder="Adicione letras nesta caixa..."></textarea>

        <div class="actions">
            <button type="button" id="limparBtn">Limpar</button>
            <button type="button" id="restaurarBtn">Restaurar</button>
            <button type="button" id="salvarBtn">Salvar</button>
            <button type="button" id="baixarBtn">Baixar (.txt)</button>
        </div>

        <div id="downloadPanel" class="download-panel" aria-hidden="true">
            <label for="filenameInput" class="label">Nome do arquivo</label>
            <div class="download-controls">
                <input id="filenameInput" type="text" placeholder="nome-do-arquivo.txt" />
                <div class="download-buttons">
                    <button type="button" id="confirmarBaixarBtn">Confirmar</button>
                    <button type="button" id="cancelarBaixarBtn" class="ghost">Cancelar</button>
                </div>
            </div>
        </div>

        <p id="status" class="status" aria-live="polite">Carregando...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
