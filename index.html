<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Bloco de Notas do Flávio</h1>
        <div class="actions">
            <button id="salvarBtn" type="button">Salvar</button>
            <button id="limparBtn" type="button">Limpar</button>
        </div>
        <div id="statusMessage" class="status-message" aria-live="polite"></div>
        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..." aria-label="Bloco de notas"></textarea>
    </main>

    <script src="script.js"></script>
</body>
</html>
