<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Bloco de Notas da Gabriely</h1>
            <p>Suas anotações são salvas automaticamente no seu navegador.</p>
        </header>

        <label for="blocoDeNotas" class="textarea-label">Digite sua anotação</label>
        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..." aria-label="Bloco de notas"></textarea>

        <div class="actions">
            <button type="button" id="limparBtn">Limpar notas</button>
            <span id="status" class="status" aria-live="polite"></span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
