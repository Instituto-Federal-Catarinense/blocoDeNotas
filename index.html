<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Meu Bloco de Notas 🎀</h1>
        <button id="mudarCor">★</button>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>
        
        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..."></textarea>
        <button id="limpaNota">★Limpa Nota★</button>
        <button id="salvaNota">★Salva Nota★</button>
        
    </div>
    <!-- place holder = fica mais clarinho, uma mensagem          
         textarea = precisa estar dentro de um formulario, mas nesse caso nao precisa-->
    <script src="script.js"></script>
</body>
</html>
