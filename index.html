<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Bloco de Notas da NyuNyu</h1>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>
        
        <div class="toolbar">
            <button id="btnSalvar">Salvar</button>
            <button id="btnBaixar">Baixar .txt</button>
            <button id="btnLimpar">Limpar</button>
            <span id="status" class="status">Último salvamento: —</span>
        </div>

        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..."></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
