<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Bloco de Notas do Joédio</h1>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>
        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..."></textarea>
        <br> <br>
        <button id="btnSalvarNota">Salvar nota</button>
        <button id="btnLimparNotas">Limpar tudo</button>
        <button id="btnAplicarClasse">Ativar tema escuro</button>
        <button id="btnRemoverClasse" style="display: none;">Remover tema escuro</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
