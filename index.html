<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <button id="tema">
        Tema
    </button>

    <div class="container">
        <div class="row" id="um">
            <a href="https://pt.wikipedia.org/wiki/Bloco_de_Notas">
                <h1>Meu Bloco de Notas</h1>
            </a>
        </div>
        <p>Suas anotações são salvas automaticamente no seu navegador... Hihi (^-^)/</p>

        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..."></textarea>

        <div class="row">
            <button id="salvar">
                Salvar Nota
            </button>
            <button id="btnLimpar">
                Limpar
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
