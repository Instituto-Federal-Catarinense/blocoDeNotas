<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Meu Bloco de Notas</h1>
        <button id="endauti">Aleatorizar cor</button>
        <button id="agrumiti">Aleatorizar fonte</button>
        <button id="hamburguer"> Aleatorizar cor da fonte</button>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>
        
        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..."></textarea>
        <button id="limparNotas">Limpar Notas</button>
        <button id="salvarNotas">Salvar Notas</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
